  <body class="bg-[#0f0f0f] text-neutral-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        var isCapacitorNative =
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === 'function' &&
          window.Capacitor.isNativePlatform();

        if (!('serviceWorker' in navigator)) return;

        if (isCapacitorNative) {
          // Внутри Android APK ассеты уже локальные — удаляем любые SW, чтобы не залипал старый кэш
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
          return;
        }

        if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (err) {
              console.log('SW registration skipped or failed:', err);
            });
          });
        }
      })();
    </script>
  </body>
